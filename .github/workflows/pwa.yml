name: PWA tests and GitHub Pages
on:
  push:
    branches: [main]
    paths: ['pwa/**', 'web-tests/**', 'supabase/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/pwa.yml']
  pull_request:
    paths: ['pwa/**', 'web-tests/**', 'supabase/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/pwa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=manual supabase/functions/cloud/index.ts
      - name: Verify checked-in synthetic test videos
        run: test -s web-tests/fixtures/clip.mp4 && test -s web-tests/fixtures/portrait.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-test-videos
          path: web-tests/fixtures/*.mp4
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: pwa

  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep the image version aligned with @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, webkit-iphone]
        shard: [1, 2]
    env:
      CI: 'true'
      PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: pwa-test-videos
          path: web-tests/fixtures
      - run: npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-browser-results-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # Preserve a single required check that fails if any shard fails or is skipped.
  test:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks and browser shards
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify touch import on the published PWA
        run: node web-tests/live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-live-results
          path: test-results/live/
